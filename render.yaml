services:
  - type: worker
    name: daily-plan-habit-tracker-bot
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: Dailyplanhabittrackbot
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/bot.db
      - key: DEFAULT_TIMEZONE
        value: UTC
